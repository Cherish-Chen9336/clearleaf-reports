name: Site report
description: A website that shows ads or doesn't work with Clearleaf
labels: [ "site report" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Opened from Clearleaf, most fields are already filled in.
        Please remove anything you don't want to share (for example, personal details in the address).
  - type: input
    id: url_address_of_the_web_page
    attributes:
      label: Web page address
      description: The page where the problem happens.
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Kind of problem
      description: "One of: ads, detection, popups, nuisance, breakage, privacy, badware"
    validations:
      required: true
  - type: input
    id: whats_wrong
    attributes:
      label: What's wrong
      description: The answer chosen in the Clearleaf popup, if any.
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Optional. What you expected and what happened instead.
  - type: textarea
    id: configuration
    attributes:
      label: Clearleaf settings
      description: Filled in by Clearleaf. Filter lists and blocking levels, no browsing history.
    validations:
      required: true
